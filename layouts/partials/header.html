{{/* Header partial for SynE Lab Website */}}
<header class="site-header">
  <div class="header-container">
    <div class="header-top">
      <div class="lab-brand">
        <a href="{{ .Site.BaseURL }}">
          {{ if .Site.Params.logo }}
          <img src="{{ .Site.Params.logo }}" alt="{{ .Site.Params.labName }}" class="lab-logo">
          {{ end }}
          <div class="lab-name-block">
            <h1 class="lab-name">{{ .Site.Params.labName | default .Site.Title }}</h1>
            <p class="lab-slogan">{{ .Site.Params.labSlogan }}</p>
          </div>
        </a>
      </div>
    </div>

    <nav class="main-nav">
      <button class="nav-toggle" aria-label="Toggle navigation" onclick="this.parentElement.classList.toggle('nav-open')">
        <span class="hamburger"></span>
      </button>
      <ul class="nav-list">
        {{ $currentPage := . }}
        {{ range site.Menus.main }}
        <li class="nav-item">
          <a href="{{ .URL }}" class="nav-link{{ if $currentPage.IsMenuCurrent "main" . }} active{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
