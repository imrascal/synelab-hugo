# Hugo Configuration for SynE Lab Website
# 合成电子学实验室 - Synthetic Electronics Laboratory
# https://synelab.xyz

baseURL = "http://synelab.xyz/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
title = "合成电子学实验室 | Synthetic Electronics Laboratory"
[pagination] pagerSize = 10
enableRobotsTXT = true
enableEmoji = true
copyright = "© 2021–2026 Synthetic Electronics Laboratory, ShanghaiTech University"

# Multi-language configuration
[languages]
  [languages.zh]
    languageCode = "zh-cn"
    languageName = "中文"
    weight = 1
    title = "合成电子学实验室"
    description = "以化成器 | Towards electronics, in a chemistry way"
    [languages.zh.params]
      labName = "合成电子学实验室"
      labSlogan = "以化成器 | Towards electronics, in a chemistry way"
      piName = "纪清清"
      affiliation = "上海科技大学物质科学与技术学院"

  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 2
    title = "Synthetic Electronics Laboratory"
    description = "Towards electronics, in a chemistry way"
    [languages.en.params]
      labName = "Synthetic Electronics Laboratory"
      labSlogan = "Towards electronics, in a chemistry way"
      piName = "Qingqing Ji"
      affiliation = "School of Physical Science and Technology, ShanghaiTech University"

# Menu configuration
[[menus.main]]
  name = "首页"
  pageRef = "/"
  weight = 1

[[menus.main]]
  name = "研究方向"
  pageRef = "/research"
  weight = 2

[[menus.main]]
  name = "组员介绍"
  pageRef = "/people"
  weight = 3

[[menus.main]]
  name = "成果及论文"
  pageRef = "/publications"
  weight = 4

[[menus.main]]
  name = "课题组新闻"
  pageRef = "/news"
  weight = 5

[[menus.main]]
  name = "加入我们"
  pageRef = "/positions"
  weight = 6

[[menus.main]]
  name = "联系我们"
  pageRef = "/contact"
  weight = 7

# Markup settings
[markup]
  [markup.highlight]
    style = "github"
    lineNos = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Params
[params]
  logo = "/images/logo.png"
  favicon = "/images/favicon.png"
  piPhoto = "/images/pi.jpg"
  heroImage = "/images/hero.jpg"
  email = "jiqq@shanghaitech.edu.cn"
  phone = "(021)-20684747"
  address = "上海市浦东新区华夏中路393号物质学院6号楼503室"
  addressEn = "Room 503, Building 6, School of Physical Science and Technology, 393 Huaxia Middle Road, Pudong, Shanghai 201210, China"
  github = "https://github.com/synelab"
  shanghaitech = "https://www.shanghaitech.edu.cn/"
  spst = "https://spst.shanghaitech.edu.cn/"
  visitorCount = true

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
