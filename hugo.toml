    weight = 1
    title = "合成电子学实验室"
    description = "以化成器 | Towards electronics, in a chemistry way"
    [languages.zh.params]
      labName = "合成电子学实验室"
      labSlogan = "以化成器 | Towards electronics, in a chemistry way"
      piName = "纪清清"
      affiliation = "上海科技大学物质科学与技术学院"
      hero_description = "合成电子学(Synthetic Electronics, SynE)旨在设计合成纳米乃至量子尺度半导体的杂化及异质结构，探索晶体管的尺寸极限，为后摩尔时代的微纳器件构筑提供一种可能的化学思路。由此践行系统材料学理念，追求材料器件化目标。"
      pi_bio = "北京大学化学本科(2007-2011)及博士(2011-2016)，MIT电子工程博士后(2016-2020)；2021年1月入职上海科技大学物质学院担任课题组长、研究员，致力于化学途径实现下一代低维电子学。"
      research_summary = "设计制备纳米乃至原子尺度的半导体杂化/异质结构，探索电子器件的微缩极限，以化学和材料工程途径实现下一代低维电子学。"
