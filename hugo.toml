      labSlogan = "Towards electronics, in a chemistry way"
      piName = "Qingqing Ji"
      affiliation = "School of Physical Science and Technology, ShanghaiTech University"
      hero_description = "Synthetic Electronics (SynE) aims to design and synthesize hybrid and heterostructures of semiconductors at the nanometer and quantum scales, exploring the size limits of transistors and providing a possible chemical approach to building micro/nano devices for the post-Moore era."
      pi_bio = "B.S. and Ph.D. in Chemistry from Peking University (2007-2016), Postdoc in Electrical Engineering at MIT (2016-2020); joined ShanghaiTech University as PI in January 2021, dedicated to next-generation low-dimensional electronics via chemical approaches."
      research_summary = "Design and synthesis of semiconductor hybrid/heterostructures at the nanometer and atomic scales, exploring the scaling limits of electronic devices via chemistry and materials engineering."
